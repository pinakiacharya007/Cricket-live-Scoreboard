<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="icon" href="img/ball.svg"><title>All matches</title></head><body><div class="bg"></div><header class="top glass" id="top"></header><main><h1 class="ph">All matches</h1><p class="meta">Tap a match to see its flow and graphs.</p><div class="tabs" id="tabs"></div><div id="list"></div></main><script src="/socket.io/socket.io.js"></script><script src="shared.js"></script><script src="app.js"></script><script src="charts.js"></script><script src="fx.js"></script><script>chrome('matches');let f='all',data=[];const open=new Set(),order={live:0,upcoming:1,completed:2};
const tabs=[['all','All'],['live','Live'],['upcoming','Upcoming'],['completed','Finished']];
function draw(){document.querySelectorAll('details.mrow').forEach(d=>d.open?open.add(d.dataset.id):open.delete(d.dataset.id));
 const a=data.filter(m=>f==='all'||m.status===f).sort((x,y)=>order[x.status]-order[y.status]||(x.status==='completed'?(y.startsAt||'').localeCompare(x.startsAt||''):(x.startsAt||'9').localeCompare(y.startsAt||'9')));
 $('#tabs').innerHTML=tabs.map(([k,t])=>`<button aria-pressed="${k===f}" data-f="${k}">${t}</button>`).join('');
 $('#list').innerHTML=a.map(m=>`<details class="glass mrow" data-id="${m.id}" ${open.has(m.id)?'open':''}><summary>${head(m)}${rows(m)}${m.result?`<p class="res">${esc(m.result)}</p>`:''}</summary><div class="body">${charts(m)}<p><a href="match.html?id=${m.id}">Open the full match page</a></p></div></details>`).join('')||'<div class="empty glass"><img src="img/stumps.svg" alt="">No matches here yet.</div>';}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){f=b.dataset.f;draw()}};
live(ms=>{data=ms;draw()});</script></body></html>
