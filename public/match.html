<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="icon" href="img/ball.svg"><title>Match</title></head><body><div class="bg"></div><header class="top glass"><a class="brand" href="/"><img src="img/ball.svg" alt="">Live Cricket Scores</a><span id="conn" title="Live connection"></span></header><main id="m"></main><script src="/socket.io/socket.io.js"></script><script src="shared.js"></script><script src="app.js"></script>
<script>const id=new URLSearchParams(location.search).get('id');
live(ms=>{const m=ms.find(x=>x.id===id);if(!m){$('#m').innerHTML='<div class="empty glass"><img src="img/stumps.svg" alt="">Match not found. Go back to all matches.</div>';return}
const s=CK.summarize(m),cur=m.innings[m.innings.length-1],bat=m.status==='live'&&cur?cur.team:'';document.title=m.teamA+' v '+m.teamB;
const side=t=>{const i=s.find(x=>x.team===t);return '<div class="side '+(t===bat?'bat':'')+'">'+crest(t)+'<div class="nm">'+esc(t)+'</div><div class="big">'+(i?i.runs+'/'+i.wkts:'–')+'</div><div class="ov">'+(i?i.overs+' / '+m.overs+' ov':'Yet to bat')+'</div></div>'};
let h='<section class="glass board"><div class="meta">'+pill(m)+'<span>'+esc(m.title)+' '+m.overs+' overs each</span></div><div class="sides">'+side(m.teamA)+'<span class="vs">v</span>'+side(m.teamB)+'</div>';
if(m.result)h+='<div class="chase">'+esc(m.result)+'</div>';
else if(s.length===2){const n=s[0].runs+1-s[1].runs;h+='<div class="chase">'+(n>0?esc(s[1].team)+' need '+n+' from '+(m.overs*6-s[1].balls)+' balls':esc(s[1].team)+' have reached the target')+'</div>'}
else if(!s.length)h+='<p class="empty" style="margin:0"><img src="img/stumps.svg" alt="">The match has not started yet.</p>';
h+='</section>';
if(cur&&cur.balls.length){const tl=CK.timeline(cur),i=s[s.length-1],last=tl[tl.length-1].ov;
 h+='<section class="glass pane"><h2>This over</h2><div class="chips">'+tl.filter(b=>b.ov===last).map(b=>'<span class="c '+CK.cls(b)+'">'+CK.chip(b)+'</span>').join('')+'</div><p class="meta" style="margin:10px 0 0">Run rate '+(i.runs/(i.balls/6||1)).toFixed(2)+'</p></section>';
 h+='<section class="glass pane"><h2>Ball by ball</h2><ul class="bb">'+tl.slice().reverse().map(b=>'<li><span class="lb">'+b.label+'</span><span class="c '+CK.cls(b)+'">'+CK.chip(b)+'</span><span>'+esc(CK.text(b))+'</span></li>').join('')+'</ul></section>'}
$('#m').innerHTML=h})</script></body></html>
