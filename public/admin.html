<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scorer</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="icon" href="img/ball.svg"></head><body>
<div class="bg"></div><header class="top glass"><a class="brand" href="/"><img src="img/ball.svg" alt="">Scorer</a><span id="conn" title="Live connection"></span></header>
<main class="narrow"><p id="msg" class="err"></p>
<section id="login" class="glass login"><img src="img/ball.svg" alt=""><h1>Scorer login</h1><div class="row"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Log in</button></div></section>
<div id="panel" hidden>
<section class="glass panel"><div class="row" style="margin-top:0"><select id="sel" aria-label="Match" style="flex:1"></select></div><div class="row"><label for="bt">First innings batting team</label><select id="bt"></select></div><div id="sum"></div></section>
<section class="glass panel"><div class="row" style="margin-top:0"><input id="st" placeholder="Batter on strike"><input id="bw" placeholder="Bowler"></div><div class="score-fields"><label for="xr">Extra runs beyond the penalty<input id="xr" type="number" min="0" max="6" value="0"></label><label for="nr">No-ball batter runs<input id="nr" type="number" min="0" max="6" value="0"></label></div><div class="pad" id="pad"></div>
<div class="row"><button class="alt" id="undo">Undo last ball</button><button id="inn">Start innings</button></div></section>
<section class="glass panel"><div class="row" style="margin-top:0"><input id="res" placeholder="Result, e.g. Tigers won by 12 runs"><button class="alt" id="fin">Finish match</button></div></section>
<section class="glass panel"><details><summary>Add a match</summary><div class="row"><input id="ta" placeholder="Team A"><input id="tb" placeholder="Team B"></div>
<div class="row"><input id="ti" placeholder="Title (optional)"><input id="ov" type="number" min="1" max="50" value="20" style="max-width:90px" aria-label="Overs"><button id="add">Add match</button></div></details>
<div class="row"><button class="danger" id="del">Delete match</button></div></section></div></main>
<script src="/socket.io/socket.io.js"></script><script src="shared.js"></script><script src="app.js"></script>
<script>let ms=[],cur=null;const say=t=>$('#msg').textContent=t||'';
const show=()=>{const t=!!localStorage.getItem('tok');$('#login').hidden=t;$('#panel').hidden=!t};
const run=async f=>{say();try{await f()}catch(e){if(e.message==='Login required'){localStorage.removeItem('tok');show()}say(e.message)}};
const post=(p,b)=>api('/api/matches/'+cur+p,{method:'POST',body:b||{}});
$('#go').onclick=()=>run(async()=>{const r=await api('/api/login',{method:'POST',body:{password:$('#pw').value}});localStorage.setItem('tok',r.token);show()});
$('#add').onclick=()=>run(async()=>{const m=await api('/api/matches',{method:'POST',body:{teamA:$('#ta').value,teamB:$('#tb').value,title:$('#ti').value,overs:$('#ov').value}});cur=m.id;$('#ta').value=$('#tb').value=''});
const ball=(r,t,w)=>{const extraRuns=Number($('#xr').value)||0;const bat=t==='nb'?Number($('#nr').value)||0:(t?0:r);const extra=t==='wd'||t==='nb'||t==='b'?1+extraRuns:0;return run(()=>post('/ball',{r:bat+extra,bat,extra,t,w,striker:$('#st').value,bowler:$('#bw').value}))};
const mk=(l,c,f)=>{const b=document.createElement('button');b.textContent=l;b.className=c;b.onclick=f;$('#pad').append(b)};
[0,1,2,3,4,6].forEach(r=>mk(r,r==4?'f4':r==6?'s6':'',()=>ball(r,'',false)));
[['Wd','wd'],['Nb','nb'],['Bye','b']].forEach(([l,t])=>mk(l,'x',()=>ball(0,t,false)));mk('W','w',()=>ball(0,'',true));
$('#undo').onclick=()=>run(()=>post('/undo'));$('#inn').onclick=()=>run(()=>post('/innings',{team:$('#bt').value}));
$('#fin').onclick=()=>run(()=>post('/finish',{result:$('#res').value}));
$('#del').onclick=()=>confirm('Delete this match for good?')&&run(async()=>{await api('/api/matches/'+cur,{method:'DELETE'});cur=null});
$('#sel').onchange=e=>{cur=e.target.value;draw()};
function draw(){const m=ms.find(x=>x.id===cur)||ms[0];cur=m?m.id:null;
 $('#sel').innerHTML=ms.map(x=>`<option value="${x.id}" ${x.id===cur?'selected':''}>${esc(x.teamA)} v ${esc(x.teamB)} (${x.status})</option>`).join('');
 $('#bt').innerHTML=m?[m.teamA,m.teamB].map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''):'';if(m&&m.innings[0])$('#bt').value=m.innings[0].team;$('#bt').disabled=!m||m.innings.length>0;
 const s=m?CK.summarize(m):[];$('#sum').innerHTML=m?(s.length?s.map(i=>`<div class="tm">${crest(i.team)}<span class="nm">${esc(i.team)}</span><b>${i.runs}/${i.wkts}</b><small>${i.overs} ov</small></div>`).join(''):'<p class="meta">Not started. Press Start innings.</p>'):'<p class="meta">Add a match below to begin.</p>';
 const idx=m?m.innings.length:0,previous=m&&m.innings[0],pScore=previous?CK.summarize({innings:[previous]})[0]:null,firstDone=previous&&(pScore.balls>=m.overs*6||pScore.wkts>=10);
 $('#inn').textContent='Start innings '+(idx+1);$('#inn').disabled=!m||m.status==='completed'||idx>=2||(idx===1&&!firstDone);
 ['undo','fin','del'].forEach(k=>$('#'+k).disabled=!m||(k!=='del'&&m.status==='completed')||(k==='undo'&&m.status!=='live'));[...$('#pad').children].forEach(b=>b.disabled=!m||m.status!=='live')}
show();live(a=>{ms=a;draw()});</script></body></html>
