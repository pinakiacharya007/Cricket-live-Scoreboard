<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="icon" href="img/ball.svg"><title>Handle match</title></head><body><div class="bg"></div><header class="top glass" id="top"></header><main class="narrow"><div id="panel" hidden>
<section class="glass panel"><div class="row" style="margin-top:0"><select id="sel" aria-label="Match" style="flex:1"></select></div><div id="when"></div>
<div class="row"><label for="bt">First innings batting team</label><select id="bt"></select></div>
<div class="toss-control"><button class="alt" id="startToss" type="button">Start toss</button><span id="tossCoin" class="toss-coin" aria-hidden="true">TOSS</span><p id="tossStatus" class="meta" role="status">Start the toss to begin.</p></div>
<div class="row"><label for="tossWinner">Toss winner</label><select id="tossWinner"><option value="">Not decided</option></select></div>
<div class="row"><label for="tossDecision">Toss decision</label><select id="tossDecision"><option value="">Choose</option><option value="batting">Bat first</option><option value="bowling">Bowl first</option></select></div>
<div class="row"><button class="alt" id="tossBtn" disabled>Announce toss</button><button class="break-button" id="breakBtn" type="button" disabled>Start break</button></div>
<div id="sum"></div>
<div class="row"><button id="inn">Start innings</button></div></section>
<section class="glass panel"><div class="row" style="margin-top:0"><input id="st" list="stl" placeholder="Batter on strike"><input id="ns" list="nsl" placeholder="Non-striker"><datalist id="stl"></datalist><datalist id="nsl"></datalist><input id="bw" list="bwl" placeholder="Bowler"><datalist id="bwl"></datalist><label class="keeper-pick" for="wk">Wicket-keeper<select id="wk"></select></label><button class="swap-button alt" id="swapEnds" type="button" title="Swap striker and non-striker">Swap ends</button></div>
<dialog id="wicketDialog" class="wicket-dialog"><h2>Record wicket</h2><label for="dismissalType">How was the batter out?</label><select id="dismissalType"><option value="bowled">Bowled</option><option value="caught">Caught</option><option value="run out">Run out</option><option value="stumped">Stumped</option><option value="lbw">LBW</option></select><label for="outPlayer">Who got out?</label><select id="outPlayer"></select><label for="newBatter">Replacement batter</label><select id="newBatter"></select><label id="catcherField" hidden for="catcher">Caught by</label><select id="catcher" hidden></select><label id="runOutField" hidden for="runBy">Run out by</label><select id="runBy" hidden></select><label id="keeperField" hidden for="dismissalKeeper">Wicket-keeper</label><select id="dismissalKeeper" hidden></select><div class="row"><button id="confirmWicket" class="danger" type="button">Record wicket</button><button id="cancelWicket" class="alt" type="button">Cancel</button></div></dialog>
<div class="row"><button class="alt" id="setp">Show these players to viewers</button></div>
<div class="score-fields"><label for="xr">Extra runs beyond the penalty<input id="xr" type="number" min="0" max="6" value="0"></label><label for="nr">No-ball batter runs<input id="nr" type="number" min="0" max="6" value="0"></label></div>
<div class="pad" id="pad"></div><div class="row"><button class="alt" id="undo">Undo last ball</button></div>
<div class="row preview"><small>Preview on this screen:</small><button class="f4" data-fx="4">FOUR</button><button class="s6" data-fx="6">SIX</button><button class="w" data-out-preview="caught">CATCH</button><button class="w" data-out-preview="run out">RUN OUT</button><button class="w" data-out-preview="bowled">BOWLED</button><button class="w" data-out-preview="stumped">STUMPED</button><button class="w" data-out-preview="lbw">LBW</button></div></section>
<section class="glass panel"><div class="row" style="margin-top:0"><input id="res" placeholder="Result, e.g. Tigers won by 12 runs"><button class="alt" id="fin">Finish match</button></div>
<div class="row"><button class="danger" id="del">Delete match</button></div></section></div></main><script src="/socket.io/socket.io.js"></script><script src="shared.js"></script><script src="app.js"></script><script src="charts.js"></script><script src="fx.js"></script><script src="admin.js"></script><script>adminInit('handle');let ms=[],cur=null,shown=null;
let tossReady=false,tossActive=false,tossTimer=null,battingPlayers=[],fieldingPlayers=[];
const fillSelect=(selector,names,placeholder,selected='')=>{const el=$(selector);el.innerHTML=`<option value="">${esc(placeholder)}</option>`+names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');if(names.includes(selected))el.value=selected};
const ball=(r,t,w,state={})=>{const x=Number($('#xr').value)||0,bat=t==='nb'?Number($('#nr').value)||0:(t?0:r),extra=t==='wd'||t==='nb'||t==='b'||t==='lb'?1+x:0;
 const payload={r:bat+extra,bat,extra,t,w:w||false,striker:$('#st').value,nonStriker:$('#ns').value,bowler:$('#bw').value,...state};
 return run(()=>post(cur,'/ball',payload));};
const mk=(l,c,f)=>{const b=document.createElement('button');b.textContent=l;b.className=c;b.onclick=f;$('#pad').append(b)};
[0,1,2,3,4,6].forEach(r=>mk(r,r==4?'f4':r==6?'s6':'',()=>ball(r,'',false)));
[['Wd','wd'],['Dead','dead'],['Nb','nb'],['Bye','b'],['LB','lb']].forEach(([l,t])=>mk(l,'x',()=>ball(0,t,false)));mk('W','w',openWicketDialog);
$('#undo').onclick=()=>run(()=>post(cur,'/undo'));$('#inn').onclick=()=>run(()=>post(cur,'/innings',{team:$('#bt').value}));
$('#setp').onclick=()=>run(()=>post(cur,'/current',{striker:$('#st').value,nonStriker:$('#ns').value,bowler:$('#bw').value}));
$('#breakBtn').onclick=()=>{const m=ms.find(x=>x.id===cur);if(m)run(()=>post(cur,'/break',{paused:!m.break}))};
$('#swapEnds').onclick=()=>{const striker=$('#st').value,nonStriker=$('#ns').value;$('#st').value=nonStriker;$('#ns').value=striker;run(()=>post(cur,'/current',{striker:nonStriker,nonStriker:striker,bowler:$('#bw').value}))};
$('#startToss').onclick=()=>run(async()=>{if(!cur)return;clearTimeout(tossTimer);tossActive=true;tossReady=false;const coin=$('#tossCoin');coin.classList.remove('flipping');void coin.offsetWidth;coin.classList.add('flipping');$('#tossStatus').textContent='The coin is in the air...';tossTimer=setTimeout(()=>{tossReady=true;coin.classList.remove('flipping');draw()},2200);try{await post(cur,'/toss/start')}catch(e){clearTimeout(tossTimer);tossTimer=null;tossActive=false;tossReady=false;coin.classList.remove('flipping');draw();throw e}});
$('#tossBtn').onclick=()=>run(async()=>{const winner=$('#tossWinner').value;const choice=$('#tossDecision').value;if(!winner||!choice)throw new Error('Pick the toss winner and decision first');const m=await post(cur,'/toss',{wonBy:winner,decision:choice});tossActive=false;tossReady=false;clearTimeout(tossTimer);tossTimer=null;FX.toss(m);say('Toss confirmed for '+winner+' to '+choice+' first');});
$('#fin').onclick=()=>run(()=>post(cur,'/finish',{result:$('#res').value}));
$('#del').onclick=()=>confirm('Delete this match for good?')&&run(async()=>{await api('/api/matches/'+cur,{method:'DELETE'});cur=null});
$('#sel').onchange=e=>{clearTimeout(tossTimer);tossTimer=null;tossReady=false;tossActive=false;cur=e.target.value;draw()};$('#bt').onchange=()=>draw();
$('#dismissalType').onchange=updateWicketFields;$('#outPlayer').onchange=updateReplacementOptions;$('#cancelWicket').onclick=()=>$('#wicketDialog').close();
$('#confirmWicket').onclick=()=>{const type=$('#dismissalType').value,outPlayer=$('#outPlayer').value,newBatter=$('#newBatter').value,catcher=$('#catcher').value,runOutBy=$('#runBy').value,keeper=$('#dismissalKeeper').value||$('#wk').value;if(!outPlayer||!newBatter){say('Choose the dismissed batter and their replacement');return}if(type==='caught'&&!catcher){say('Choose the catcher from the bowling team');return}if(type==='run out'&&!runOutBy){say('Choose who ran the batter out');return}if(type==='stumped'&&!keeper){say('Choose the wicket-keeper from the bowling team');return}const striker=$('#st').value,nonStriker=$('#ns').value;const nextStriker=outPlayer===striker?newBatter:striker,nextNonStriker=outPlayer===nonStriker?newBatter:nonStriker;$('#wicketDialog').close();$('#st').value=nextStriker;$('#ns').value=nextNonStriker;ball(0,'',{type,catcher,fielder:catcher,runOutBy,wicketkeeper:keeper,outPlayer,newBatter},{nextStriker,nextNonStriker,striker:outPlayer})};
function openWicketDialog(){say();if(!battingPlayers.length||!fieldingPlayers.length){say('Add both team squads before recording a wicket');return}const atCrease=[...new Set([$('#st').value,$('#ns').value].filter(Boolean))],eligibleOut=atCrease.length?atCrease:battingPlayers;$('#dismissalType').value='bowled';fillSelect('#outPlayer',eligibleOut,'Choose dismissed batter',$('#st').value);fillSelect('#catcher',fieldingPlayers,'Choose catcher');fillSelect('#runBy',fieldingPlayers,'Choose fielder');fillSelect('#dismissalKeeper',fieldingPlayers,'Choose wicket-keeper',$('#wk').value);updateReplacementOptions();updateWicketFields();$('#wicketDialog').showModal()}
function updateReplacementOptions(){const out=$('#outPlayer').value,atCrease=[$('#st').value,$('#ns').value];fillSelect('#newBatter',battingPlayers.filter(name=>name!==out&&!atCrease.includes(name)),'Choose replacement batter')}
function updateWicketFields(){const type=$('#dismissalType').value;$('#catcherField').hidden=$('#catcher').hidden=type!=='caught';$('#runOutField').hidden=$('#runBy').hidden=type!=='run out';$('#keeperField').hidden=$('#dismissalKeeper').hidden=type!=='stumped';if(type==='stumped'&&!$('#dismissalKeeper').value)$('#dismissalKeeper').value=$('#wk').value}
document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>FX.ball(b.dataset.fx==='w'?{w:{type:'caught',catcher:'Fielder'},striker:'Batter',nonStriker:'Partner',bowler:'Bowler'}:{bat:+b.dataset.fx,striker:'Batter',nonStriker:'Partner',bowler:'Bowler'}));
document.querySelectorAll('[data-out-preview]').forEach(b=>b.onclick=()=>{const type=b.dataset.outPreview;FX.ball({w:{type,catcher:$('#dismissalCatcher').value||'Fielder',fielder:$('#dismissalCatcher').value||'Fielder',runOutBy:$('#dismissalRunner').value||'Fielder',wicketkeeper:$('#wk').value||'Keeper'},striker:$('#st').value||'Batter',bowler:$('#bw').value||'Bowler'})});
function draw(){const m=ms.find(x=>x.id===cur)||ms[0];cur=m?m.id:null;$('#sel').innerHTML=matchSelect(ms,cur);
const keep=$('#bt').value,keepKeeper=$('#wk').value;$('#bt').innerHTML=m?[m.teamA,m.teamB].map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''):'';
 $('#tossWinner').innerHTML=m?`<option value="">Not decided</option><option value="${esc(m.teamA)}">${esc(m.teamA)}</option><option value="${esc(m.teamB)}">${esc(m.teamB)}</option>`:'<option value="">Not decided</option>';
 if(m&&m.toss&&m.toss.wonBy){$('#tossWinner').value=m.toss.wonBy;$('#tossDecision').value=m.toss.decision||'';}
 if(m&&m.toss&&m.toss.status==='flipping'&&!tossActive){tossActive=true;const remaining=Math.max(0,2200-(Date.now()-(m.toss.startedAt||0)));tossReady=remaining===0;$('#tossCoin').classList.toggle('flipping',remaining>0);if(remaining){tossTimer=setTimeout(()=>{tossReady=true;tossTimer=null;$('#tossCoin').classList.remove('flipping');draw()},remaining)}}
 if(m&&m.toss&&m.toss.status==='announced'){tossActive=false;tossReady=false;clearTimeout(tossTimer);tossTimer=null}
 if(m&&m.innings[0])$('#bt').value=m.innings[0].team;else if(m&&keep&&[m.teamA,m.teamB].includes(keep))$('#bt').value=keep;$('#bt').disabled=!m||m.innings.length>0;
 const n=m?m.innings.length:0,last=m&&m.innings[n-1],bat=!m?'':last?last.team:($('#bt').value||m.teamA),fld=!m?'':bat===m.teamA?m.teamB:m.teamA,sq=t=>!m?[]:(t===m.teamA?m.squadA:m.squadB)||[];battingPlayers=sq(bat);fieldingPlayers=sq(fld);
 fillSelect('#wk',fieldingPlayers,'Wicket-keeper',keepKeeper);fillSelect('#dismissalKeeper',fieldingPlayers,'Choose wicket-keeper',$('#wk').value);fillSelect('#catcher',fieldingPlayers,'Choose catcher',$('#catcher').value);fillSelect('#runBy',fieldingPlayers,'Choose fielder',$('#runBy').value);
 $('#stl').innerHTML=sq(bat).map(p=>`<option value="${esc(p)}">`).join('');$('#nsl').innerHTML=sq(bat).map(p=>`<option value="${esc(p)}">`).join('');$('#bwl').innerHTML=sq(fld).map(p=>`<option value="${esc(p)}">`).join('');
 $('#st').placeholder='Batter on strike'+(bat?' ('+bat+')':'');$('#ns').placeholder='Non-striker'+(bat?' ('+bat+')':'');$('#bw').placeholder='Bowler'+(fld?' ('+fld+')':'');
 if(shown!==cur){shown=cur;$('#st').value=m&&m.current?m.current.striker:'';$('#ns').value=m&&m.current?m.current.nonStriker:'';$('#bw').value=m&&m.current?m.current.bowler:'';$('#res').value=m?m.result||'':'';}
 $('#when').innerHTML=m?whenHTML(m):'';
 const s=m?CK.summarize(m):[];$('#sum').innerHTML=m?(s.length?s.map(i=>`<div class="tm">${crest(i.team)}<span class="nm">${esc(i.team)}</span><b>${i.runs}/${i.wkts}</b><small>${i.overs} ov</small></div>`).join(''):'<p class="meta">Not started. Press Start innings.</p>'):'<p class="meta">No match yet. Add one on the Add match page.</p>';
 if(m&&m.toss&&m.toss.announced){$('#sum').insertAdjacentHTML('beforeend',`<p class="meta">${esc(CK.tossText(m))}</p>`)}
 const tossAnnounced=!!(m&&m.toss&&m.toss.announced);$('#startToss').disabled=!m||n>0||tossAnnounced||m.status==='completed'||tossActive;$('#tossWinner').disabled=!m||!tossReady||n>0;$('#tossDecision').disabled=!m||!tossReady||n>0;$('#tossBtn').disabled=!m||!tossReady||tossAnnounced||n>0||m.status==='completed';$('#tossStatus').textContent=tossAnnounced?CK.tossText(m):tossReady?'Coin landed. Choose the winner and their decision.':tossActive?'Coin is in the air...':n>0?'The toss is locked after the first innings starts.':'Start the toss to begin.';
 $('#breakBtn').textContent=m&&m.break?'Resume match':'Start break';$('#breakBtn').disabled=!m||m.status!=='live';$('#swapEnds').disabled=!m||m.status!=='live'||m.break||!$('#st').value||!$('#ns').value;
 $('#inn').textContent='Start innings '+(n+1);$('#inn').disabled=!m||m.status==='completed'||n>=2||(n===1&&!CK.complete(m,0));
 ['setp','undo','fin','del'].forEach(k=>$('#'+k).disabled=!m||(k!=='del'&&m.status==='completed')||(k==='undo'&&m.status!=='live'));
 [...$('#pad').children].forEach(b=>b.disabled=!m||m.status!=='live'||m.break)}
live(a=>{ms=a;draw()});</script></body></html>
