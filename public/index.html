<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="icon" href="img/ball.svg"><title>Live Cricket Scores</title></head><body><div class="bg"></div><header class="top glass" id="top"></header><main><section class="hero glass"><div><h1>Every ball, as it happens.</h1><p>Scores update the moment the scorer taps. No refresh needed.</p></div><img src="img/ball.svg" alt=""></section><div id="list"></div></main><script src="/socket.io/socket.io.js"></script><script src="shared.js"></script><script src="app.js"></script><script src="charts.js"></script><script src="fx.js"></script><script>chrome('home');
const by=(a,b)=>(a.startsAt||'9').localeCompare(b.startsAt||'9');
live(ms=>{if(ms.some(m=>m.toss&&m.toss.status==='flipping'))FX.tossing();else FX.stopTossing();const sec=(t,s,f)=>{const a=ms.filter(m=>m.status===s).sort(f||(()=>0));return a.length?`<h2>${t}</h2><div class="grid">${a.map(card).join('')}</div>`:''};
$('#list').innerHTML=sec('Live now','live')+sec('Coming up','upcoming',by)+sec('Finished','completed',(a,b)=>by(b,a))||'<div class="empty glass"><img src="img/stumps.svg" alt="">No matches yet. Check back soon.</div>'},(m,toss,kind)=>{if(kind==='toss-start')FX.tossing();else if(kind==='toss-result')FX.toss(m)})</script></body></html>
